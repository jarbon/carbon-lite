<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brewtown Coffee — Menu</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">☕ Brewtown</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html" class="active">Menu</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <h1>Menu</h1>

    <div class="menu-controls">
      <input type="search" id="menu-search" placeholder="Search drinks &amp; food…"
             aria-label="Search menu">
      <div id="category-filters" class="filters" role="group" aria-label="Filter by category">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="coffee">Coffee</button>
        <button class="filter-btn" data-category="tea">Tea</button>
        <button class="filter-btn" data-category="food">Food</button>
      </div>
    </div>

    <div id="menu-grid" class="grid" aria-live="polite">
      <p class="loading">Loading…</p>
    </div>
    <p id="no-results" class="hidden">No items match your search.</p>
  </main>

  <footer class="site-footer">
    <p>© 2026 Brewtown Coffee · 123 Roast St, Portland, OR</p>
  </footer>

  <script src="js/menu-data.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
